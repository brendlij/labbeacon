agent:
  id: srv-01
  name: Server 1
  poll_interval: 20s
  expire_after: 60s
  log_level: info
  metrics_enabled: true
host_control:
  enabled: false # Native Linux/systemd only; intentionally unavailable in Docker.
agent_control:
  enabled: false
mqtt:
  broker: tcp://192.168.1.10:1883
  username: ""
  password: ""
  discovery_prefix: homeassistant
modules:
  system:
    enabled: true
    # Paths are in the container namespace; /hostfs is the host root mount.
    disk_paths: ["/hostfs"] # Example additional disk: /hostfs/mnt/data
    temperature: false
    processes: false
    top_n: 5
    file_descriptors: false
    boot_time: false
  docker:
    enabled: false
    socket_path: /var/run/docker.sock
    timeout: 5s
    stats: false
    control_containers:
      enabled: false
      allow: []
      deny: []
    image_updates:
      enabled: false
      interval: 6h
      timeout: 5s
  services:
    enabled: false
    checks: []
  tailscale:
    enabled: false
    command: tailscale
    timeout: 5s
  netbird:
    enabled: false
    command: netbird
    timeout: 5s
  network:
    enabled: false
    local_ips: true
    public_ip:
      enabled: false
      endpoint: https://api.ipify.org
      interval: 15m
      timeout: 5s

# Embedded settings UI; explicit LAN binding is optional.
webui:
  enabled: true
  bind_address: 127.0.0.1
  port: 8011
  username: ""
  password: ""
  allowed_hosts: [] # Exact DNS names, e.g. [server.home.arpa]; IPs work without this.

# Master gate; individual actions above remain opt-in.
control_actions:
  enabled: true
