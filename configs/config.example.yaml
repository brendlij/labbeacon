agent:
  id: ser5-01
  name: ser5-01
  poll_interval: 20s
  expire_after: 60s
mqtt:
  broker: tcp://127.0.0.1:1883
  username: ""
  password: ""
modules:
  system:
    enabled: true
    temperature: true
    disk_paths: [/hostfs] # Native installation: use / instead.
  docker:
    enabled: true
    socket_path: /var/run/docker.sock
    timeout: 5s
    stats: false # Optional per-container CPU/RAM; status is always collected.
    control_containers:
      enabled: false # Enable explicitly in Settings when wanted.
      allow: [] # Empty: all containers once control is enabled.
      deny: []
  services:
    enabled: false
    bus_socket: "" # Auto: HOST_RUN/dbus/system_bus_socket or /run/dbus/system_bus_socket.
    checks: []
    # Add only the units you want, for example:
    # - name: SSH
    #   type: systemd
    #   systemd_unit: ssh.service
    #   timeout: 5s
control_actions:
  enabled: true
webui:
  enabled: true
  bind_address: 127.0.0.1
  port: 8011
  username: ""
  password: ""
  allowed_hosts: []
