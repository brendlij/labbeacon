name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
      - run: go build ./...
      - name: Compile both Linux architectures
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /tmp/labbeacon-$arch ./cmd/labbeacon
          done
      - name: MQTT integration
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          mosquitto -p 18884 > /tmp/mosquitto.log 2>&1 &
          MQTT_TEST_BROKER=tcp://127.0.0.1:18884 go test -race -count=1 ./internal/mqtt -run TestBrokerIntegration
      - name: Container build
        run: docker build -t labbeacon:test .
      - name: Setup and bundled Tailscale smoke test
        run: |
          sh -n deploy/setup.sh
          docker run --rm --entrypoint sh labbeacon:test -c 'tailscale version'
          sudo sh deploy/setup.sh --lan /tmp/labbeacon-setup-smoke > /tmp/labbeacon-setup.log
          sudo docker compose -f /tmp/labbeacon-setup-smoke/compose.generated.yaml config --quiet
          sudo docker run --rm -v /tmp/labbeacon-setup-smoke:/etc/labbeacon labbeacon:test -check-config
          sudo grep -F "group_add: [\"$(stat -c '%g' /var/run/docker.sock)\"]" /tmp/labbeacon-setup-smoke/compose.generated.yaml
          sudo sh -c 'sha256sum /tmp/labbeacon-setup-smoke/config.yaml > /tmp/labbeacon-config-before'
          if sudo sh deploy/setup.sh --lan /tmp/labbeacon-setup-smoke > /dev/null 2>&1; then exit 1; fi
          sudo sha256sum -c /tmp/labbeacon-config-before
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./...
